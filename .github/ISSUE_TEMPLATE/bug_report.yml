name: Bug report
description: Describe a reproducible problem in MessageTransit.
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a reproducible problem in MessageTransit when issue reporting is available.
        GitHub Issues are currently disabled for this repository. Read the [support guidance](https://github.com/JacobChwastek/MessageTransit/blob/develop/SUPPORT.md) for current contact availability and reproduction requirements.
        For a suspected vulnerability, read the [security policy](https://github.com/JacobChwastek/MessageTransit/blob/develop/SECURITY.md) before sharing details.
  - type: input
    id: version
    attributes:
      label: MessageTransit package version or source commit
      description: Enter the exact package versions, or the commit SHA and branch for a local source build.
      placeholder: Package IDs and versions, or source commit SHA and branch
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: On which operating system(s) are you experiencing the issue?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
  - type: dropdown
    id: broker
    attributes:
      label: Using which broker(s) did you encounter the issue?
      multiple: true
      options:
        - RabbitMQ
        - Azure Service Bus
        - Amazon SQS
        - ActiveMQ
        - In-Memory
        - Mediator
        - Kafka
        - Azure Event Hub
        - SQL transport
  - type: input
    id: environment
    attributes:
      label: SDK, runtime, broker, and database versions
      description: Include the .NET SDK and runtime versions and any relevant broker or database versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What are the steps required to reproduce the issue?
      description: Outline the steps to reproduce the issue, including a minimal code sample and configuration with credentials removed.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      placeholder: Describe the intended result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: Describe the observed result and include the exception when applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Related log output, including any exceptions
      description: Follow the [logging guidance](https://github.com/JacobChwastek/MessageTransit/blob/develop/SUPPORT.md#collect-application-logs) and capture startup through the failing operation. Remove credentials and sensitive message contents before sharing.
      render: shell
  - type: input
    id: repository
    attributes:
      label: Link to repository that demonstrates/reproduces the issue
      description: If you have a standalone repository that reproduces the issue, paste the link here (highly recommended).
      placeholder: https://github.com/user/repo
    validations:
      required: false
