name: Transport Validation
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  coverage:
    name: Manual transport coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Report validation scope
        run: sed -n '/^## Manual transport validation/,/^## /{/^## Local commands/!p;}' CI.md >> "$GITHUB_STEP_SUMMARY"

  test-activemq:
    name: "Transports: ActiveMQ"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test ActiveMQ
        uses: ./.github/actions/test
        with:
          project: MessageTransit.ActiveMqTransport.IntegrationTests

  test-rabbitmq:
    name: "Transports: RabbitMQ"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test RabbitMQ
        uses: ./.github/actions/test
        with:
          project: MessageTransit.RabbitMqTransport.IntegrationTests

  test-sqs:
    name: "Transports: SQS (+S3)"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test SQS
        uses: ./.github/actions/test
        with:
          project: MessageTransit.AmazonSqsTransport.IntegrationTests
