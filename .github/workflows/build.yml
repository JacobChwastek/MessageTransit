name: MessageTransit
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'MessageTransit.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.gitignore'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'COPYRIGHT'
      - 'THIRD-PARTY-NOTICES'
      - 'docs/legal/redistribution-inventory.md'
      - 'README.md'
      - 'NuGet.README.md'
      - 'docs/releasing.md'
      - '.github/**'
      - 'scripts/**'
      - 'release/**'
      - 'docs/ci.md'
    branches:
      - '**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'MessageTransit.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.gitignore'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'COPYRIGHT'
      - 'THIRD-PARTY-NOTICES'
      - 'docs/legal/redistribution-inventory.md'
      - 'README.md'
      - 'NuGet.README.md'
      - 'docs/releasing.md'
      - '.github/**'
      - 'scripts/**'
      - 'release/**'
      - 'docs/ci.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate for a release candidate.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref && github.run_id || 'branch' }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run release regressions
        run: python3 -B -m unittest discover -s scripts/tests

  coverage:
    name: CI coverage and exclusions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Report the declared matrix and unavailable integrations
        run: cat docs/ci.md >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: Build
    timeout-minutes: 15
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build every project and check benchmark startup
        run: python scripts/ci_build.py

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Unit Tests
        uses: ./.github/actions/test
        with:
          project: MessageTransit.Tests

      - name: Test Abstractions
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test
        with:
          project: MessageTransit.Abstractions.Tests

      - name: Test Analyzers
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test
        with:
          project: MessageTransit.Analyzers.Tests

      - name: Test NServiceBus interoperability
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test
        with:
          project: MessageTransit.Interop.NServiceBus.Tests

  test-dynamodb:
    name: "Storage: DynamoDB"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.0.2
        ports:
          - "4566:4566"
        options: --health-cmd "curl --fail http://localhost:4566/_localstack/health || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 15s
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: true
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test DynamoDB
        uses: ./.github/actions/test
        with:
          project: MessageTransit.DynamoDbIntegration.Tests

  test-dapper:
    name: "Storage: Dapper"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/azure-sql-edge
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "Password12!"
        ports:
          - 1433:1433
    env:
      # otherwise the client barks
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Dapper
        uses: ./.github/actions/test
        with:
          project: MessageTransit.DapperIntegration.Tests
  test-marten:
    name: "Storage: Marten"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: "Password12!"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Marten
        uses: ./.github/actions/test
        with:
          project: MessageTransit.MartenIntegration.Tests
  test-nhibernate:
    name: "Storage: NHibernate"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test NHibernate
        uses: ./.github/actions/test
        with:
          project: MessageTransit.NHibernateIntegration.Tests
  test-hangfire:
    name: "Scheduler: Hangfire"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Hangfire
        uses: ./.github/actions/test
        with:
          project: MessageTransit.HangfireIntegration.Tests
  test-quartz:
    name: "Scheduler: Quartz"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Quartz
        uses: ./.github/actions/test
        with:
          project: MessageTransit.QuartzIntegration.Tests
  test-signalr:
    name: SignalR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test SignalR
        uses: ./.github/actions/test
        with:
          project: MessageTransit.SignalR.Tests
