name: MassTransit
env:
  MASSTRANSIT_VERSION: 8.5.10
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'MassTransit.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.gitignore'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'COPYRIGHT'
      - 'THIRD-PARTY-NOTICES'
      - 'docs/legal/redistribution-inventory.md'
      - 'docs/decisions/0001-fork-provenance-and-support.md'
      - '.github/**'
      - 'scripts/ci_*.py'
      - 'CI.md'
    branches:
      - '**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'MassTransit.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.gitignore'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'COPYRIGHT'
      - 'THIRD-PARTY-NOTICES'
      - 'docs/legal/redistribution-inventory.md'
      - 'docs/decisions/0001-fork-provenance-and-support.md'
      - '.github/**'
      - 'scripts/ci_*.py'
      - 'CI.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: CI coverage and exclusions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Report the declared matrix and unavailable integrations
        run: cat CI.md >> "$GITHUB_STEP_SUMMARY"

  compile:
    name: Build
    timeout-minutes: 15
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build every project and check benchmark startup
        run: python scripts/ci_build.py

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Unit Tests
        uses: ./.github/actions/test
        with:
          project: MassTransit.Tests

      - name: Test Abstractions
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test
        with:
          project: MassTransit.Abstractions.Tests

      - name: Test Analyzers
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test
        with:
          project: MassTransit.Analyzers.Tests

      - name: Test NServiceBus interoperability
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test
        with:
          project: MassTransit.Interop.NServiceBus.Tests

  test-activemq:
    name: "Transports: ActiveMQ"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test ActiveMQ
        uses: ./.github/actions/test
        with:
          project: MassTransit.ActiveMqTransport.IntegrationTests

  test-sql-transport:
    name: "Transport: SQL"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Database Transport
        uses: ./.github/actions/test
        with:
          project: MassTransit.SqlTransport.IntegrationTests

  test-rabbitmq:
    name: "Transports: RabbitMQ"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test RabbitMQ
        uses: ./.github/actions/test
        with:
          project: MassTransit.RabbitMqTransport.IntegrationTests
  test-sqs:
    name: "Transports: SQS (+S3)"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test SQS
        uses: ./.github/actions/test
        with:
          project: MassTransit.AmazonSqsTransport.IntegrationTests
  test-dynamodb:
    name: "Storage: DynamoDB"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.0.2
        ports:
          - "4566:4566"
        options: --health-cmd "curl --fail http://localhost:4566/_localstack/health || exit 1" --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 15s
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: true
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test DynamoDB
        uses: ./.github/actions/test
        with:
          project: MassTransit.DynamoDbIntegration.Tests

  test-azure-table:
    name: "Storage: Azure Table"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Azure Table
        uses: ./.github/actions/test
        with:
          project: MassTransit.Azure.Table.IntegrationTests

  test-dapper:
    name: "Storage: Dapper"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/azure-sql-edge
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "Password12!"
        ports:
          - 1433:1433
    env:
      # otherwise the client barks
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Dapper
        uses: ./.github/actions/test
        with:
          project: MassTransit.DapperIntegration.Tests
  test-entity-framework:
    name: "Storage: EntityFramework Core"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # otherwise the client barks
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test EntityFrameworkCore
        uses: ./.github/actions/test
        with:
          project: MassTransit.EntityFrameworkCoreIntegration.IntegrationTests

  test-marten:
    name: "Storage: Marten"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: "Password12!"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Marten
        uses: ./.github/actions/test
        with:
          project: MassTransit.MartenIntegration.Tests
  test-mongo:
    name: "Storage: MongoDB"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test MongoDB
        uses: ./.github/actions/test
        with:
          project: MassTransit.MongoDbIntegration.IntegrationTests

  test-nhibernate:
    name: "Storage: NHibernate"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test NHibernate
        uses: ./.github/actions/test
        with:
          project: MassTransit.NHibernateIntegration.Tests
  test-redis:
    name: "Storage: Redis"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Redis
        uses: ./.github/actions/test
        with:
          project: MassTransit.RedisIntegration.IntegrationTests
  test-valkey:
    name: "Storage: Valkey"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      MT_REDIS_SERVER: valkey
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Valkey
        uses: ./.github/actions/test
        with:
          project: MassTransit.RedisIntegration.IntegrationTests
  test-hangfire:
    name: "Scheduler: Hangfire"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Hangfire
        uses: ./.github/actions/test
        with:
          project: MassTransit.HangfireIntegration.Tests
  test-quartz:
    name: "Scheduler: Quartz"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Quartz
        uses: ./.github/actions/test
        with:
          project: MassTransit.QuartzIntegration.Tests
  test-eventhub:
    name: "Rider: EventHub"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test EventHub
        uses: ./.github/actions/test
        with:
          project: MassTransit.EventHubIntegration.IntegrationTests

  test-kafka:
    name: "Rider: Kafka"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test Kafka
        uses: ./.github/actions/test
        with:
          project: MassTransit.KafkaIntegration.IntegrationTests

  test-signalr:
    name: SignalR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test SignalR
        uses: ./.github/actions/test
        with:
          project: MassTransit.SignalR.Tests

  calc-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs:
      - compile
      - test-unit
      - test-activemq
      - test-rabbitmq
      - test-sqs
      - test-dynamodb
      - test-sql-transport
      - test-azure-table
      - test-dapper
      - test-entity-framework
      - test-marten
      - test-mongo
      - test-nhibernate
      - test-redis
      - test-valkey
      - test-hangfire
      - test-quartz
      - test-eventhub
      - test-kafka
      - test-signalr
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref }}" = 'refs/heads/master' ]; then
            echo "version=${MASSTRANSIT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=${MASSTRANSIT_VERSION}-develop.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish NuGets
    timeout-minutes: 60
    runs-on: windows-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.repository == 'MassTransit/MassTransit' && success()
    env:
      DOTNET_INSTALL_DIR: D:\dotnet
      NUGET_PACKAGES: D:\.nuget\packages
    needs:
      - calc-version
    steps:
      - name: Version Output Check
        run: |
          echo "${{ needs.calc-version.outputs.version }}"

      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and Pack Solution
        run: |
          dotnet build -c Release -p:Version=${{ needs.calc-version.outputs.version }}
          dotnet pack --no-build -c Release -p:PackageVersion=${{ needs.calc-version.outputs.version }} -o ./artifacts

      - name: Publish NuGets
        working-directory: artifacts
        run: |
          dotnet nuget push * -s https://api.nuget.org/v3/index.json -k ${{secrets.NUGET_API_KEY}} --skip-duplicate --no-symbols

